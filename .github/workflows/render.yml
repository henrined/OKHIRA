name: Render Video

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Target Platform (Call To Action)'
        required: true
        default: 'facebook'
        type: choice
        options:
          - facebook
          - tiktok_bio
          - tiktok_pub_bouton
          - instagram_reels
          - facebook_instagram_pub
          - youtube_shorts
  push:
    branches:
      - main
      - master

jobs:
  render:
    name: Render Remotion Video
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install NPM Dependencies
        run: npm ci

      - name: Render Full Video (45s)
        run: |
          mkdir -p out
          PLATFORM="${{ github.event.inputs.platform || 'facebook' }}"
          echo "Rendering Full Video (45s) for platform: $PLATFORM"
          npx remotion render src/index.ts ScwbAd out/scwb_video_${PLATFORM}_45s.mp4 \
            --props="{\"platform\": \"$PLATFORM\"}" \
            --gl=angle \
            --chromium-options="--no-sandbox,--disable-gpu,--disable-dev-shm-usage"

      - name: Render Short Video (<= 30s for Stories / Reels / Ads)
        run: |
          PLATFORM="${{ github.event.inputs.platform || 'facebook' }}"
          echo "Rendering Short Video (<= 30s) for platform: $PLATFORM"
          npx remotion render src/index.ts ScwbAd30s out/scwb_video_${PLATFORM}_30s.mp4 \
            --props="{\"platform\": \"$PLATFORM\"}" \
            --gl=angle \
            --chromium-options="--no-sandbox,--disable-gpu,--disable-dev-shm-usage"

      - name: Upload Videos Artifact
        uses: actions/upload-artifact@v4
        with:
          name: scwb_videos_${{ github.event.inputs.platform || 'facebook' }}
          path: out/*.mp4
          if-no-files-found: error
          retention-days: 14
